<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6feb">
<meta name="color-scheme" content="light dark">
<!-- iOS ignores the manifest for "Add to Home Screen" polish, so these three
     tags carry the equivalent behaviour there: standalone (no browser chrome),
     a dark status bar readable against the blue header, and the launcher name. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cleaning">
<title>Woodhouse Cleaning</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="testbar" id="testbar" hidden></div>
<header class="bar" id="bar" hidden>
  <button class="ghost" id="back" hidden title="Back" aria-label="Back">
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5"/><path d="m11 6-6 6 6 6"/></svg>
    <span class="back-label">Back</span></button>
  <h1 id="title">Woodhouse Cleaning</h1>
  <div class="who-box" id="who" hidden>
    <span class="who-text">
      <span class="who-name" id="whoName"></span>
      <span class="who-role" id="whoRole"></span>
    </span>
    <span class="avatar" id="whoAvatar"></span>
  </div>
  <!-- Text on a laptop, icon on a phone, where the building name needs the room. -->
  <button class="ghost" id="signout" title="Sign out" aria-label="Sign out">
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5h-8a1 1 0 0 0-1 1v11a1 1 0 0 0 1 1h8"/><path d="M11 12h9"/><path d="m16.5 8 4 4-4 4"/></svg>
    <span class="signout-label">Sign out</span></button>
</header>
<nav class="nav" id="nav" hidden></nav>
<main id="app"><p class="muted center" id="booting">Loading…</p></main>
<button class="fab" id="quickfab" hidden title="Report a problem">
  <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  <span class="fab-label">Report</span>
</button>
<!-- If app.js never runs - a script error, or a bad response cached by an old
     service worker - the page would otherwise sit on "Loading…" for ever with
     nothing to act on. This says so instead, and offers the one fix that
     works: throw the cached copy away and fetch it again. -->
<script>
  // Registered here rather than from app.js so that a broken app.js can still
  // be repaired by a later deploy: this always runs, so a new worker always
  // installs, and its activate step clears the older caches.
  if ('serviceWorker' in navigator) {
    addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
  }

  window.addEventListener('error', (e) => { window.__bootError = e.message; });
  setTimeout(async () => {
    const el = document.getElementById('booting');
    if (!el || !el.isConnected) return; // the app took over, as it should
    let detail = window.__bootError || '';
    if (!detail) {
      try {
        const res = await fetch('/app.js', { cache: 'no-store' });
        if (!res.ok) detail = `The app failed to load (${res.status}).`;
      } catch { detail = 'No connection to the site.'; }
    }
    el.innerHTML = `<strong>The app didn't start.</strong><br>${
      detail ? `${detail}<br>` : ''}<button id="bootreset">Reload the app</button>`;
    document.getElementById('bootreset').onclick = async () => {
      try {
        const keys = await caches.keys();
        await Promise.all(keys.map((k) => caches.delete(k)));
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map((r) => r.unregister()));
      } catch { /* nothing cached to clear */ }
      location.reload();
    };
  }, 8000);
</script>
<script src="/app.js"></script>
</body>
</html>
