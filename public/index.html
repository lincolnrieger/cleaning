<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- The strip behind the clock and battery, matched to the app bar sitting
     under it rather than to a blue that no longer appears anywhere. -->
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171b22" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<!-- iOS ignores the manifest for "Add to Home Screen" polish, so these three
     tags carry the equivalent behaviour there: standalone (no browser chrome),
     a status bar iOS keeps clear of the page, and the launcher name.
     Deliberately NOT black-translucent: that draws a white clock straight over
     the app bar, which is white. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cleaning">
<title>Woodhouse Cleaning</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="testbar" id="testbar" hidden></div>
<header class="bar" id="bar" hidden>
  <button class="ghost" id="back" hidden title="Back" aria-label="Back">
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5"/><path d="m11 6-6 6 6 6"/></svg>
    <span class="back-label">Back</span></button>
  <h1 id="title">Woodhouse Cleaning</h1>
  <div class="who-box" id="who" hidden>
    <span class="who-text">
      <span class="who-name" id="whoName"></span>
      <span class="who-role" id="whoRole"></span>
    </span>
    <span class="avatar" id="whoAvatar"></span>
  </div>
  <!-- Text on a laptop, icon on a phone, where the building name needs the room. -->
  <button class="ghost" id="signout" title="Sign out" aria-label="Sign out">
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5h-8a1 1 0 0 0-1 1v11a1 1 0 0 0 1 1h8"/><path d="M11 12h9"/><path d="m16.5 8 4 4-4 4"/></svg>
    <span class="signout-label">Sign out</span></button>
</header>
<nav class="nav" id="nav" hidden></nav>
<main id="app"><p class="muted center" id="booting">Loading…</p></main>
<button class="fab" id="quickfab" hidden title="Report a problem">
  <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  <span class="fab-label">Report</span>
</button>
<!-- If the app never takes over this page - a script error, a bad response
     cached by an old service worker, or a server still setting itself up after
     an update - it would otherwise sit on "Loading…" for ever with nothing to
     act on. This works out which of those it is, says so, and offers the two
     fixes: try again, or throw the cached copy away and fetch it fresh. -->
<script>
  // Registered here rather than from app.js so that a broken app.js can still
  // be repaired by a later deploy: this always runs, so a new worker always
  // installs, and its activate step clears the older caches.
  if ('serviceWorker' in navigator) {
    addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
  }

  window.addEventListener('error', (e) => { window.__bootError = e.message; });
  // An await that rejects never reaches window.onerror, and the app's very
  // first await - fetching the config - is exactly that kind of failure.
  window.addEventListener('unhandledrejection', (e) => {
    window.__bootError = window.__bootError || e.reason?.message || String(e.reason ?? '');
  });

  const alive = () => document.getElementById('booting')?.isConnected
    && document.getElementById('booting');

  // Three seconds in, say something. The first request after an update can
  // take a moment, and a page that sits on one word looks broken.
  const settling = setTimeout(() => { const el = alive(); if (el) el.textContent = 'Starting up…'; }, 3000);

  setTimeout(async () => {
    clearTimeout(settling);
    const el = alive();
    if (!el) return; // the app took over, as it should

    // Show the panel and its two ways out straight away, then fill in the
    // reason as the checks below come back - a screen that says nothing while
    // it works out what is wrong is the problem we are fixing.
    el.innerHTML = '<strong>The app hasn\'t started yet.</strong><br>'
      + '<span id="bootwhy">Still waiting on the server…</span><br>'
      + '<button id="bootretry">Try again</button> '
      + '<button id="bootreset">Reset and reload</button>';
    document.getElementById('bootretry').onclick = () => location.reload();
    document.getElementById('bootreset').onclick = async () => {
      try {
        const keys = await caches.keys();
        await Promise.all(keys.map((k) => caches.delete(k)));
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map((r) => r.unregister()));
      } catch { /* nothing cached to clear */ }
      location.reload();
    };

    const why = (text) => {
      const node = document.getElementById('bootwhy');
      if (node) node.textContent = text;
    };
    // A probe that hangs tells us nothing, so cap each one.
    const get = (path, ms) => {
      const stop = new AbortController();
      const timer = setTimeout(() => stop.abort(), ms);
      return fetch(path, { cache: 'no-store', signal: stop.signal })
        .finally(() => clearTimeout(timer));
    };

    // Which of the three is it: a broken app file, a server that refuses, or
    // a server that is merely slow? Say which, rather than leaving anyone to
    // guess from a blank screen.
    if (window.__bootError) return why(`The app reported: ${window.__bootError}`);

    try {
      const res = await get('/app.js', 8000);
      if (!res.ok) return why(`The app file failed to load (${res.status}).`);
    } catch {
      return why('No connection to the site.');
    }

    const started = Date.now();
    try {
      const res = await get('/api/config', 25000);
      const took = Math.round((Date.now() - started) / 1000);
      if (res.ok) {
        why(`The server took ${took}s to answer. It sets itself up after an `
          + 'update, so give it a moment and try again.');
      } else {
        const body = await res.json().catch(() => ({}));
        why(`The server said: ${body.error || `error ${res.status}`}`);
      }
    } catch {
      why('The server did not answer. It may still be setting itself up after '
        + 'an update — try again in a minute.');
    }
  }, 15000);
</script>
<script src="/app.js"></script>
</body>
</html>
