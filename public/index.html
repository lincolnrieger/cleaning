<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6feb">
<meta name="color-scheme" content="light dark">
<!-- iOS ignores the manifest for "Add to Home Screen" polish, so these three
     tags carry the equivalent behaviour there: standalone (no browser chrome),
     a dark status bar readable against the blue header, and the launcher name. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cleaning">
<title>Basecamp Cleaning</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="testbar" id="testbar" hidden></div>
<header class="bar" id="bar" hidden>
  <button class="ghost" id="back" hidden title="Back"><span aria-hidden="true">←</span><span class="back-label">Back</span></button>
  <h1 id="title">Basecamp Cleaning</h1>
  <div class="who-box" id="who" hidden>
    <span class="who-text">
      <span class="who-name" id="whoName"></span>
      <span class="who-role" id="whoRole"></span>
    </span>
    <span class="avatar" id="whoAvatar"></span>
  </div>
  <button class="ghost" id="signout" title="Sign out">Sign out</button>
</header>
<nav class="nav" id="nav" hidden></nav>
<main id="app"><p class="muted center">Loading…</p></main>
<script src="/app.js"></script>
</body>
</html>
