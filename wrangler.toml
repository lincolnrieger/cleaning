name = "basecamp-cleaning"
pages_build_output_dir = "public"
compatibility_date = "2024-11-01"

# The D1 database. Replace database_id with the id printed by:
#   npx wrangler d1 create basecamp-cleaning
[[d1_databases]]
binding = "DB"
database_name = "basecamp-cleaning"
database_id = "REPLACE_WITH_YOUR_DATABASE_ID"

# Optional: photo storage for maintenance reports. Create with:
#   npx wrangler r2 bucket create basecamp-cleaning-photos
# Delete this block if you don't want photo uploads - the app hides the
# photo field automatically when the bucket isn't bound.
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "basecamp-cleaning-photos"

[vars]
TIMEZONE = "Australia/Sydney"
OFFICE_PHONE = "0402 930 714"
MAINTENANCE_PHONE = "0437 316 386"
# Set to "1" if you want the office to see only the rollup, never the
# per-task detail of an individual building.
OFFICE_ROLLUP_ONLY = "0"

# AUTH_SECRET is a secret, not a var. Set it with:
#   npx wrangler pages secret put AUTH_SECRET
